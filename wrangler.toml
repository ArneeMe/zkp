name = "diskusjonsforum"
pages_build_output_dir = "frontend"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
DEV_MODE = "true"

# KV namespace – create in Cloudflare dashboard (Workers & Pages → KV),
# then bind it to this Pages project under Settings → Functions → KV namespace bindings
# with the variable name: KV
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_KV_NAMESPACE_PREVIEW_ID"
